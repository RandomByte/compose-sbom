name: Test

# Runs tests/run.sh and the linters from AGENTS.md.

on:
  pull_request:
  # release.yml calls this workflow for pushes to main.
  workflow_call:

permissions: {}

env:
  # Hashes from the "digest" field of the release assets in the GitHub API.
  # actionlint also publishes a checksum file with the same hash.
  SHELLCHECK_VERSION: 0.11.0
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
  SHFMT_VERSION: 3.14.1
  SHFMT_SHA256: 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  ZIZMOR_VERSION: 1.31.1
  ZIZMOR_SHA256: d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run tests
        run: tests/run.sh

      - name: Install linters
        run: |
          bin=$RUNNER_TEMP/bin
          mkdir -p "$bin"
          download() {
            curl -fsSLo "$RUNNER_TEMP/$2" "https://github.com/$1/$2"
            echo "$3  $RUNNER_TEMP/$2" | sha256sum -c -
          }
          download "koalaman/shellcheck/releases/download/v$SHELLCHECK_VERSION" \
            "shellcheck-v$SHELLCHECK_VERSION.linux.x86_64.tar.xz" "$SHELLCHECK_SHA256"
          tar -xJf "$RUNNER_TEMP/shellcheck-v$SHELLCHECK_VERSION.linux.x86_64.tar.xz" -C "$bin" \
            --strip-components=1 "shellcheck-v$SHELLCHECK_VERSION/shellcheck"
          download "mvdan/sh/releases/download/v$SHFMT_VERSION" \
            "shfmt_v${SHFMT_VERSION}_linux_amd64" "$SHFMT_SHA256"
          install -m 755 "$RUNNER_TEMP/shfmt_v${SHFMT_VERSION}_linux_amd64" "$bin/shfmt"
          download "rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION" \
            "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" "$ACTIONLINT_SHA256"
          tar -xzf "$RUNNER_TEMP/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -C "$bin" actionlint
          download "zizmorcore/zizmor/releases/download/v$ZIZMOR_VERSION" \
            zizmor-x86_64-unknown-linux-gnu.tar.gz "$ZIZMOR_SHA256"
          tar -xzf "$RUNNER_TEMP/zizmor-x86_64-unknown-linux-gnu.tar.gz" -C "$bin" zizmor
          echo "$bin" >>"$GITHUB_PATH"

      - name: shellcheck
        if: ${{ !cancelled() }}
        run: shellcheck sbom.sh tests/run.sh tests/bin/grype

      - name: shfmt
        if: ${{ !cancelled() }}
        run: shfmt -d sbom.sh tests/run.sh tests/bin/grype

      # actionlint does not know the context properties job.workflow_repository
      # and job.workflow_sha yet.
      - name: actionlint
        if: ${{ !cancelled() }}
        run: actionlint -ignore 'property "workflow_(repository|sha)" is not defined'

      - name: zizmor
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format github .github/workflows
